name: 24/7 Daily Market Stream & Filing Ingestion

on:
  schedule:
    # 매일 평일 장중 15분 및 자정 (UTC 15:00)
    - cron: '0 15 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Record unavailable collector
        run: |
          python3 scripts/record_observability.py

      - name: Commit & Push Incremental Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(auto-ingest): 24/7 daily market stream update $(date -u +'%Y-%m-%d')" && git push origin main)
